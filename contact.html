<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | RAWFAW Art</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Page Wrapper -->
    <div id="app-wrapper">

        <!-- Neon Header Banner -->
        <header class="neon-header">
            <div class="header-left">
                <a href="index.html" class="logo" id="logo-btn">RAWFAW Art</a>
                <button class="search-btn" id="search-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span data-i18n="search">SEARCH</span>
                </button>
            </div>

            <nav class="header-nav">
                <a href="bio.html" class="nav-link" data-i18n="nav_bio">Artist Bio</a>
                <a href="contact.html" class="nav-link active" data-i18n="nav_contact">Contact</a>
            </nav>

            <div class="header-right">
                <div class="lang-switch" id="lang-switch">
                    <button type="button" class="lang-btn active" data-lang="en">EN</button>
                    <button type="button" class="lang-btn" data-lang="ko">KO</button>
                </div>
                <!-- Mobile Hamburger Menu Button -->
                <button class="menu-mobile-btn" id="mobile-menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </header>

        <!-- Mobile Navigation Menu Dropdown -->
        <div class="mobile-nav-menu" id="mobile-nav-menu">
            <a href="bio.html" class="mobile-nav-link" data-i18n="nav_bio">Artist Bio</a>
            <a href="contact.html" class="mobile-nav-link active" data-i18n="nav_contact">Contact</a>
            <div class="lang-switch lang-switch-mobile">
                <button type="button" class="lang-btn active" data-lang="en">EN</button>
                <button type="button" class="lang-btn" data-lang="ko">KO</button>
            </div>
        </div>

        <!-- Contact Section -->
        <section id="contact-section" class="contact-section">
            <div class="contact-header">
                <h2 data-i18n="contact_heading">Contact</h2>
            </div>

            <form id="inquiry-form" class="inquiry-form" action="https://formsubmit.co/jiwooon513@gmail.com" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="_subject" value="New inquiry from RAWFAW Art website">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" id="form-next-url" value="">

                <div class="form-group">
                    <label data-i18n="label_inquiry_type">Inquiry Type</label>
                    <div class="inquiry-type-options" id="inquiry-type-options">
                        <label class="radio-option">
                            <input type="radio" name="inquiry_type" value="general" id="inquiry-type-general" checked>
                            <span data-i18n="inquiry_type_general">General Inquiry</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="inquiry_type" value="purchase" id="inquiry-type-purchase">
                            <span data-i18n="inquiry_type_purchase">Purchase Inquiry</span>
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="input-name"><span data-i18n="label_name">Name</span> <span class="required">*</span></label>
                        <input type="text" id="input-name" name="name" required data-i18n-placeholder="placeholder_name" placeholder="Please enter your name.">
                    </div>
                    <div class="form-group">
                        <label for="input-company" data-i18n="label_company">Company</label>
                        <input type="text" id="input-company" name="company" data-i18n-placeholder="placeholder_company" placeholder="Please enter your company name.">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="input-email"><span data-i18n="label_email">Email</span> <span class="required">*</span></label>
                        <input type="email" id="input-email" name="email" required data-i18n-placeholder="placeholder_email" placeholder="Please enter your email address.">
                    </div>
                    <div class="form-group">
                        <label for="input-phone"><span data-i18n="label_phone">Phone</span> <span class="optional-tag" id="phone-required-tag" data-i18n="optional_tag">(Optional)</span></label>
                        <div class="phone-field-row">
                            <select id="phone-country-code" name="phone_country_code" class="phone-country-select">
                                <option value="+82" selected>🇰🇷 +82</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+81">🇯🇵 +81</option>
                                <option value="+86">🇨🇳 +86</option>
                                <option value="+852">🇭🇰 +852</option>
                                <option value="+886">🇹🇼 +886</option>
                                <option value="+65">🇸🇬 +65</option>
                                <option value="+61">🇦🇺 +61</option>
                                <option value="+49">🇩🇪 +49</option>
                                <option value="+33">🇫🇷 +33</option>
                                <option value="+39">🇮🇹 +39</option>
                                <option value="+34">🇪🇸 +34</option>
                                <option value="+31">🇳🇱 +31</option>
                                <option value="+91">🇮🇳 +91</option>
                                <option value="+55">🇧🇷 +55</option>
                                <option value="+971">🇦🇪 +971</option>
                                <option value="+84">🇻🇳 +84</option>
                                <option value="+66">🇹🇭 +66</option>
                                <option value="+62">🇮🇩 +62</option>
                                <option value="+52">🇲🇽 +52</option>
                            </select>
                            <input type="tel" id="input-phone" name="phone" data-i18n-placeholder="placeholder_phone" placeholder="Please enter numbers only, without '-'.">
                        </div>
                    </div>
                </div>

                <div class="form-group hidden" id="purchase-only-fields">
                    <label for="input-address"><span data-i18n="label_address">Shipping Address</span> <span class="optional-tag" data-i18n="optional_tag">(Optional)</span></label>
                    <input type="text" id="input-address" name="shipping_address" data-i18n-placeholder="placeholder_address" placeholder="Where should we ship the artwork?">
                </div>

                <div class="form-group">
                    <div class="textarea-header">
                        <label for="input-message"><span data-i18n="label_message">Message</span> <span class="required">*</span></label>
                        <span class="char-counter"><span id="char-count">0</span>/1000</span>
                    </div>
                    <textarea id="input-message" name="message" maxlength="1000" required placeholder="Questions or requests? (Please write within 1000 characters.)"></textarea>
                </div>

                <!-- Custom Styled File Attachment -->
                <div class="form-group file-upload-group">
                    <label data-i18n="label_attach">Attach File</label>
                    <div class="file-upload-wrapper">
                        <span class="file-name" id="file-name-label" data-i18n="no_file_selected">No file selected</span>
                        <label for="input-file" class="file-upload-btn" data-i18n="label_attach">Attach File</label>
                        <input type="file" id="input-file" name="attachment" class="hidden-file-input">
                    </div>
                </div>

                <!-- Privacy Policy Consent Checkbox -->
                <div class="form-group checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="input-agree" required>
                        <span class="checkmark"></span>
                        <span class="checkbox-text" data-i18n="privacy_agree">I agree to the Privacy Policy.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn" data-i18n="submit_btn">Submit</button>
            </form>
        </section>

        <!-- Footer -->
        <footer class="main-footer">
            <div class="footer-info">
                <p data-i18n="footer_company">RAWFAW House</p>
                <p data-i18n="footer_biz">Business Reg. No. 150-09-02984</p>
                <p data-i18n="footer_address">Address: Seongdong-gu, Seoul, South Korea</p>
                <p class="copyright">Copyright &copy; 2026 RAWFAW Art All rights reserved.</p>
            </div>
        </footer>

    </div>


    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
